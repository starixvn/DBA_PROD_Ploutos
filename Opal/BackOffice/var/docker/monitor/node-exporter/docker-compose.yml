version: '3.3'
services:
  prometheus:
    image: prom/node-exporter
    container_name: PrometheusExporter_Node
    hostname: PrometheusExporter_Node
    restart: always
    pid: "host"
    networks:
      - ploutos-backend
    expose:
      - '9100'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - --collector.filesystem.ignored-mount-points
      - "^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2|rootfs/run/docker/netns|rootfs/var/lib/docker/aufs)($$|/)"
networks:
  ploutos-backend:
    external:
      name: ploutos-backend