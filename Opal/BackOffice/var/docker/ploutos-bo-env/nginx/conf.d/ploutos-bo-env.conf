upstream bo-api-proxy {
  server 127.0.0.1;
}

server {
  listen 80;
  server_name bo.opal88.com;
  root /usr/local/ploutos/bo-webapp/build;

  rewrite ^/bo-api$ /bo-api/ redirect;

  location / {
    index index.html index.htm;

    try_files $uri $uri/ /bo-api$uri;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
  }

  location /bo-api/ {
    proxy_pass http://bo-api-proxy/;
  }

  location /grafana/ {
    proxy_pass http://Grafana:3000/;
    rewrite ^/grafana/(.*) /$1 break;
  }
}

server {
  listen 80;
  server_name bo-api-proxy;
  root /usr/local/ploutos/bo-api/web;

  location / {
    try_files $uri /app.php$is_args$args;
  }

  location ~ ^/app\.php(/|$) {
    fastcgi_pass unix:/var/run/php-fpm/php-fpm.sock;
    fastcgi_split_path_info ^(.+\.php)(/.*)$;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    internal;
  }
}