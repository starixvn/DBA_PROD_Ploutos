#bo.12ploutos.com
server {
    
    listen 80;
    server_name bo.12ploutos.com;

    index index.html index.htm;
    root /var/www/web;

    rewrite ^/bo-api$ /bo-api/ redirect;

    location / {
        try_files $uri $uri/ /bo-api$uri;

        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;
    }
    
    location /bo-api/ {
        proxy_pass http://api.12ploutos.com/;
    }
}

